services:
  # Web Service - Main Flask Application
  - type: web
    name: safa-downtown-halls
    env: python
    region: oregon  # يمكن تغييرها حسب المنطقة المفضلة (frankfurt, singapore, etc.)
    plan: free  # أو starter, standard حسب الحاجة
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_APP
        value: run.py
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true  # Render سينشئ مفتاح سري تلقائياً
      - key: DATABASE_URL
        fromDatabase:
          name: safa-halls-db
          property: connectionString
      - key: SQLALCHEMY_TRACK_MODIFICATIONS
        value: false
      - key: SESSION_COOKIE_SECURE
        value: true
      - key: SESSION_COOKIE_HTTPONLY
        value: true
      - key: SESSION_COOKIE_SAMESITE
        value: Lax
    healthCheckPath: /
    autoDeploy: true

databases:
  # PostgreSQL Database
  - name: safa-halls-db
    databaseName: safa_halls
    user: safa_halls_user
    plan: free  # أو starter, standard حسب الحاجة
    region: oregon  # يجب أن تكون نفس منطقة الـ web service

