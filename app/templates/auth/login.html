{% extends "base.html" %}

{% block title %}تسجيل الدخول - Safa Downtown Halls{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-lg">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <h1 class="h2 mb-2">
                        <i class="fas fa-building text-primary"></i>
                    </h1>
                    <h2 class="h4">Safa Downtown Halls</h2>
                    <p class="text-muted">نظام إدارة الحجوزات</p>
                </div>
                
                <form method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">اسم المستخدم</label>
                        <input type="text" class="form-control" id="username" name="username" placeholder="أدخل اسم المستخدم" required autofocus>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label">كلمة المرور</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="أدخل كلمة المرور" required>
                    </div>
                    
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="remember_me" name="remember_me">
                        <label class="form-check-label" for="remember_me">تذكرني</label>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-sign-in-alt"></i> دخول
                    </button>
                </form>
                
                <hr class="my-4">
                <p class="text-center text-muted small">
                    <strong>حساب تجريبي:</strong><br>
                    المستخدم: <code>admin</code><br>
                    كلمة المرور: <code>admin123</code>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
